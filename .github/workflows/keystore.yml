name: Generate Keystore

# یک‌بار اجرا می‌شود: keystore اختصاصی اپ را می‌سازد تا اپلیکیشن با امضای ثابت
# در مایکت/بازار/گوگل‌پلی منتشر شود (کلید دیباگ برای انتشار کافی نیست).
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias chai \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass chai2026 -keypass chai2026 \
            -dname "CN=Chai, OU=Chai, O=Chai, L=Tehran, C=IR"

      - name: Prepare artifact
        run: |
          base64 -w 0 release.jks > release.jks.base64
          sha256sum release.jks > release.jks.sha256
          cat release.jks.sha256

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: chai-keystore
          path: |
            release.jks
            release.jks.base64
            release.jks.sha256
          retention-days: 90
