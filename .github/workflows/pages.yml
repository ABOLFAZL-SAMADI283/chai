name: Deploy Privacy Policy (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'store/privacy-policy.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp store/privacy-policy.html _site/index.html
          # فایل جدا برای دسترسی مستقیم با نام مشخص
          cp store/privacy-policy.html _site/privacy-policy.html

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
