name: Android Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chai-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release (unsigned) — نیازمند keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          ./gradlew assembleRelease
          echo "TAPSELL_APP_KEY=${{ secrets.TAPSELL_APP_KEY }}" >> gradle.properties
          echo "TAPSELL_ZONE_BANNER=${{ secrets.TAPSELL_ZONE_BANNER }}" >> gradle.properties
          echo "TAPSELL_ZONE_INTERSTITIAL=${{ secrets.TAPSELL_ZONE_INTERSTITIAL }}" >> gradle.properties
          echo "TAPSELL_ZONE_REWARDED=${{ secrets.TAPSELL_ZONE_REWARDED }}" >> gradle.properties

      - name: Upload release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: chai-release-apk
          path: app/build/outputs/apk/release/*.apk
