name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # نکتهٔ مهم: کانتکست secrets داخل if مجاز نیست؛ از env استفاده می‌کنیم
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # چون gradle-wrapper داخل ریپو نیست، خود Gradle را نصب می‌کنیم
      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
          gradle --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── نسخهٔ ریلیز: فقط اگر keystore اضافه شده باشد ──
      - name: Restore keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.jks"
          ls -l "${{ github.workspace }}/release.jks"
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        if: env.KEYSTORE_B64 != ''
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: chai-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
