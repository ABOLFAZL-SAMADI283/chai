<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>چای — موکاپ صفحهٔ تمرکز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --surface:#fff; --primary:#0F766E; --primary2:#14B8A6; --soft:#CCFBF1;
    --tea:#8B5E3C; --milk:#F5EFDF; --gold:#D4A017; --gold2:#F59E0B;
    --text:#1C1917; --text2:#78716C; --line:#EDE4D8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Vazirmatn,Tahoma,sans-serif;background:#1b1512;
    display:flex;gap:40px;align-items:center;justify-content:center;padding:40px;
  }
  .stage{
    width:1080px;height:1920px;border-radius:44px;overflow:hidden;position:relative;
    background:
      radial-gradient(120% 60% at 50% 0%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
      radial-gradient(90% 50% at 50% 100%, #F1E9DC 0%, rgba(241,233,220,0) 70%),
      var(--bg);
    box-shadow:0 40px 90px rgba(0,0,0,.5);
    display:flex;flex-direction:column;
  }
  .status{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;
          font-size:30px;font-weight:700;color:var(--text);flex:none}
  .content{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 56px;position:relative}

  /* ── نشان هدف ── */
  .badge{
    width:120px;height:120px;border-radius:60px;background:var(--soft);
    display:flex;align-items:center;justify-content:center;font-size:56px;
    box-shadow:0 12px 26px rgba(15,118,110,.16);
    animation:pop .7s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  .goal{font-size:46px;font-weight:900;color:var(--text);margin-top:26px;
        animation:rise .6s .12s ease-out both}
  .sub{font-size:27px;color:var(--text2);margin-top:6px;animation:rise .6s .2s ease-out both}
  @keyframes rise{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* ── ماگ ── */
  .cupwrap{position:relative;width:660px;height:660px;margin:40px 0 10px;
           animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}

  .ring-bg{fill:none;stroke:var(--soft);stroke-width:13}
  .ring-fg{fill:none;stroke:var(--primary);stroke-width:13;stroke-linecap:round;
           stroke-dasharray:1660;stroke-dashoffset:1250;
           transform:rotate(-90deg);transform-origin:50% 50%;
           animation:fill 1.8s .35s cubic-bezier(.2,.8,.3,1) both}
  @keyframes fill{from{stroke-dashoffset:1660}to{stroke-dashoffset:1250}}

  .cup{animation:cupIn .9s .25s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes cupIn{from{transform:translateY(26px) scale(.9);opacity:0}to{transform:none;opacity:1}}

  /* چای در حال پر شدن */
  .tea{transform-origin:center;animation:teaFill 2.6s .6s cubic-bezier(.3,.9,.4,1) both}
  @keyframes teaFill{from{transform:translateY(46px)}to{transform:translateY(0)}}

  /* بخار */
  .steam{stroke:#C9BBA6;stroke-width:7;stroke-linecap:round;fill:none;opacity:0}
  .s1{animation:steamUp 3.4s 1.1s ease-in-out infinite}
  .s2{animation:steamUp 3.4s 1.9s ease-in-out infinite}
  @keyframes steamUp{
    0%{opacity:0;transform:translateY(16px) scaleX(.85)}
    30%{opacity:.75}
    100%{opacity:0;transform:translateY(-54px) scaleX(1.25)}
  }

  /* تایمر — دقیقاً داخل بدنهٔ لیوان (مرکز بدنه ≈ ۵۹٪ ارتفاع) */
  .timer{
    position:absolute;left:0;right:0;top:59%;transform:translateY(-50%);text-align:center;
    animation:rise .8s .5s ease-out both;
  }
  .time{
    font-size:92px;font-weight:900;color:#fff;letter-spacing:1px;
    text-shadow:0 3px 14px rgba(0,0,0,.55);
    font-variant-numeric:tabular-nums;
  }
  .remain{font-size:24px;color:rgba(245,239,223,.92);margin-top:2px;
          text-shadow:0 2px 10px rgba(0,0,0,.5)}

  /* ── نوار پیشرفت ── */
  .barwrap{width:100%;margin-top:8px;animation:rise .6s .65s ease-out both}
  .track{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
  .fill{height:100%;width:24%;border-radius:99px;background:linear-gradient(90deg,var(--primary2),var(--primary));
        animation:slide 2.6s .6s cubic-bezier(.3,.9,.4,1) both}
  @keyframes slide{from{width:0}to{width:24%}}
  .elapsed{font-size:26px;color:var(--text2);margin-top:16px}

  /* ── پیل قفل ── */
  .lock{
    display:flex;align-items:center;gap:12px;background:var(--soft);color:var(--primary);
    border-radius:999px;padding:16px 30px;font-size:27px;font-weight:500;margin-top:38px;
    animation:rise .6s .8s ease-out both;
  }
  .lock .pulse{width:14px;height:14px;border-radius:50%;background:var(--primary);
    animation:blink 1.8s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.78)}}

  .cancel{margin-top:auto;margin-bottom:70px;color:var(--text2);font-size:26px;
          padding:24px;animation:rise .6s 1s ease-out both}

  /* ── کارت پایان ── */
  .done{
    position:absolute;inset:0;background:rgba(251,247,240,.97);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    animation:fade .6s ease-out both;padding:0 70px;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .cupdone{width:210px;height:210px;border-radius:50%;background:var(--soft);
           display:flex;align-items:center;justify-content:center;font-size:118px;
           box-shadow:0 18px 40px rgba(15,118,110,.18);
           animation:pop .8s cubic-bezier(.2,1.5,.4,1) both}
  .done h2{font-size:52px;font-weight:900;color:var(--primary);margin-top:38px;
           animation:rise .7s .25s ease-out both}
  .done p{font-size:30px;color:var(--text2);margin-top:10px;
          animation:rise .7s .35s ease-out both}
  .stats{display:flex;gap:26px;margin-top:52px;animation:rise .7s .45s ease-out both}
  .stat{background:var(--surface);border-radius:26px;padding:26px 44px;text-align:center;
        box-shadow:0 8px 24px rgba(28,25,23,.07)}
  .stat b{display:block;font-size:44px;font-weight:900;color:var(--primary)}
  .stat span{font-size:24px;color:var(--text2)}
  .cta{margin-top:60px;width:100%;background:var(--primary);color:#fff;border-radius:28px;
       padding:34px;text-align:center;font-size:34px;font-weight:700;
       box-shadow:0 16px 34px rgba(15,118,110,.3);animation:rise .7s .55s ease-out both}

  .bubbles{position:absolute;inset:0;overflow:hidden}
  .bubbles i{position:absolute;bottom:-40px;width:18px;height:18px;border-radius:50%;
             background:rgba(15,118,110,.13);animation:float 5s linear infinite}
  @keyframes float{to{transform:translateY(-2100px)}}
</style>
</head>
<body>

<!-- ══════════ حالت ۱: در حال تمرکز ══════════ -->
<div class="stage" id="focusStage">
  <div class="status"><span>۹:۵۸</span><span>●●●</span></div>
  <div class="content">
    <div class="badge">📚</div>
    <div class="goal">درس خواندن</div>
    <div class="sub">تا برگشت به تمرکز</div>

    <div class="cupwrap">
      <svg viewBox="0 0 200 200" style="width:100%;height:100%">
        <defs>
          <clipPath id="cupClip"><path d="M62 72 L142 72 L135 158 C124 164 80 164 69 158 Z"/></clipPath>
          <linearGradient id="teaG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A9743F"/><stop offset="1" stop-color="#7A4E2E"/>
          </linearGradient>
        </defs>

        <!-- حلقهٔ پیشرفت -->
        <circle class="ring-bg" cx="100" cy="100" r="88"/>
        <circle class="ring-fg" cx="100" cy="100" r="88"/>

        <!-- بخار -->
        <path class="steam s1" d="M86 60 C 96 46, 76 38, 86 24"/>
        <path class="steam s2" d="M114 58 C 124 46, 106 38, 114 26"/>

        <!-- ماگ -->
        <g class="cup">
          <g clip-path="url(#cupClip)">
            <rect class="tea" x="55" y="72" width="95" height="95" fill="url(#teaG)"/>
            <rect class="tea" x="55" y="72" width="95" height="4" fill="#C08A55" opacity=".85"/>
          </g>
          <!-- دسته -->
          <path d="M142 86 C 172 86, 174 122, 144 130 L139 118 C 157 114, 157 100, 137 98 Z"
                fill="none" stroke="#8B5E3C" stroke-width="6" stroke-linejoin="round"/>
          <!-- بدنه -->
          <path d="M62 72 L142 72 L135 158 C 124 164, 80 164, 69 158 Z"
                fill="#F5EFDF" stroke="#8B5E3C" stroke-width="6" stroke-linejoin="round"/>
          <!-- براقیت -->
          <path d="M74 84 L84 84 L79 150 L73 150 Z" fill="#fff" opacity=".5"/>
        </g>
      </svg>

      <div class="timer">
        <div class="time">۲۳:۴۱</div>
        <div class="remain">باقی‌مانده</div>
      </div>
    </div>

    <div class="barwrap">
      <div class="track"><div class="fill"></div></div>
      <div class="elapsed">۶ دقیقه و ۱۹ ثانیه گذشته</div>
    </div>

    <div class="lock">
      <span class="pulse"></span>
      <span>تلگرام، اینستاگرام و یوتیوب قفل شدند</span>
    </div>

    <div class="cancel">لغو جلسه (استریک می‌شکند)</div>
  </div>
</div>

<!-- ══════════ حالت ۲: پایان جلسه ══════════ -->
<div class="stage" id="doneStage">
  <div class="status"><span>۱۰:۳۰</span><span>●●●</span></div>
  <div class="bubbles" id="bubbles"></div>
  <div class="done">
    <div class="cupdone">☕</div>
    <h2>آفرین! چای تموم شد</h2>
    <p>درس خواندن · ۳۰ دقیقه تمرکز</p>
    <div class="stats">
      <div class="stat"><b>٪۱۰۰</b><span>کامل</span></div>
      <div class="stat"><b>۳۰ دقیقه</b><span>تمرکز</span></div>
      <div class="stat"><b>۷ روز</b><span>استریک</span></div>
    </div>
    <div class="cta">عالی بود، بریم ادامه</div>
  </div>
</div>

<script>
  // حباب‌های تزئینی
  const b = document.getElementById('bubbles');
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('i');
    el.style.left = (Math.random() * 100) + '%';
    el.style.width = el.style.height = (8 + Math.random() * 22) + 'px';
    el.style.animationDuration = (4 + Math.random() * 5) + 's';
    el.style.animationDelay = (Math.random() * 5) + 's';
    b.appendChild(el);
  }
</script>
</body>
</html>
