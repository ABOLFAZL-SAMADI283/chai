<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>چای — آیکون</title>
<style>
  html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#0F766E}
  .icon{width:100vw;height:100vh;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="icon">
  <svg viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0F766E"/>
        <stop offset="1" stop-color="#0B5F59"/>
      </linearGradient>
      <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#A9743F"/>
        <stop offset="1" stop-color="#7A4E2E"/>
      </linearGradient>
      <clipPath id="cup">
        <path d="M150 150 L362 150 L330 386 C 300 402, 212 402, 182 386 Z"/>
      </clipPath>
    </defs>

    <!-- پس‌زمینه -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- چهارگوش روشن‌تر (امضای بصری اپ) -->
    <path fill="#14B8A6" fill-opacity="0.22" d="M0 0 L256 0 L256 256 L0 256 Z M256 256 L512 256 L512 512 L256 512 Z"/>
    <!-- حلقهٔ نازک دور آیکون -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="#F5EFDF" stroke-opacity="0.14" stroke-width="3"/>

    <!-- بخار -->
    <g stroke="#F5EFDF" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M214 118 C 232 92, 196 74, 214 48"/>
      <path d="M290 112 C 308 88, 274 70, 290 46"/>
    </g>

    <!-- دستگیره -->
    <path d="M362 198 C 428 198, 428 318, 362 318"
          fill="none" stroke="#8B5E3C" stroke-width="26" stroke-linecap="round"/>

    <!-- ۱) بدنه -->
    <path d="M150 150 L362 150 L330 386 C 300 402, 212 402, 182 386 Z" fill="#F5EFDF"/>

    <!-- ۲) چای -->
    <g clip-path="url(#cup)">
      <rect x="140" y="232" width="240" height="180" fill="url(#tea)"/>
      <rect x="140" y="232" width="240" height="10" fill="#C08A55" opacity="0.9"/>
    </g>

    <!-- ۳) خط بدنه -->
    <path d="M150 150 L362 150 L330 386 C 300 402, 212 402, 182 386 Z"
          fill="none" stroke="#8B5E3C" stroke-width="24" stroke-linejoin="round"/>

    <!-- براقیت -->
    <path d="M178 186 L206 186 L188 356 L166 356 Z" fill="#FFFFFF" opacity="0.5"/>
  </svg>
</div>
</body>
</html>
